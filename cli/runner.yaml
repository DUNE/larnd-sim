  compression: 'lzf'
  n_events: 50

nsys:
  exec: "/global/common/software/dune/mkramer/misc_software/nsight-systems-2023.4.1/bin/nsys"
  output_dir: "test/nsys"
  output_file: "larnd-sim.profile"

ncu:
  exec: "/global/common/software/dune/mkramer/misc_software/NVIDIA-Nsight-Compute-2024.3/ncu"
  kernels: ["calc_light_detector_response"]
  output_dir: "test/ncu"
  output_file: "larnd-sim.profile"

compare:
  reference: "larnd-sim-reference.hdf5"

report:
  report: "nvtx_sum"
  timeunit: "ms"
  format: "csv"
